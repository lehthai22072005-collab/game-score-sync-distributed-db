<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giám Sát Hệ Phân Tán</title>
    <style>
        body {
            background-color: #1a252f; 
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 20px; }
        .grid-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            height: 85vh; 
        }
        .node-frame {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .node-title {
            background-color: #f1c40f;
            color: #2c3e50;
            font-weight: bold;
            padding: 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 2px solid #f1c40f;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            background-color: #2c3e50;
        }
    </style>
</head>
<body>

    <h1>🖥️ Dashboard Tổng: Đồng Bộ Điểm Số (Chandy-Lamport)</h1>

    <div class="grid-container">
        <div class="node-frame">
            <div class="node-title">Máy Chủ A (Master)</div>
            <iframe src="http://localhost:8081/index.html?v=2"></iframe>
        </div>

        <div class="node-frame">
            <div class="node-title">Máy Chủ B</div>
            <iframe src="http://localhost:8082/index.html?v=2"></iframe>
        </div>

        <div class="node-frame">
            <div class="node-title">Máy Chủ C</div>
            <iframe src="http://localhost:8083/index.html?v=2"></iframe>
        </div>
    </div>

</body>
</html>
