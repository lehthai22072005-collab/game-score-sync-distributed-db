<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Game Score Dashboard</title>
    <style>
        body { background-color: #2c3e50; color: white; font-family: sans-serif; text-align: center; margin-top: 20px; }
        .dashboard-container { background-color: #34495e; padding: 20px; border-radius: 15px; display: inline-block; width: 90%; max-width: 400px; }
        .dashboard-header { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .port-number { color: #f1c40f; }

        /* CSS CHO THANH TRẠNG THÁI (BANNER) */
        .status-banner { padding: 8px; margin-bottom: 15px; border-radius: 5px; font-weight: bold; font-size: 14px; background-color: #27ae60; transition: background-color 0.3s; }
        .status-crashed { background-color: #c0392b; }
        .status-recovered { background-color: #2980b9; }

        #score-list { list-style: none; padding: 0; font-size: 26px; color: #2ecc71; font-weight: bold; min-height: 40px; border-top: 2px solid #2c3e50; border-bottom: 2px solid #2c3e50; padding-top: 15px; padding-bottom: 15px; }
        .control-panel { background-color: #1a252f; padding: 15px; border-radius: 10px; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        input, select, button { padding: 8px; border-radius: 5px; border: none; font-size: 14px; }
        button { background-color: #e74c3c; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #c0392b; }
        .update-text { font-size: 12px; color: #bdc3c7; margin-top: 15px; }
    </style>
</head>
<body>
<div class="dashboard-container">
    <div class="dashboard-header">Node - Port: <span class="port-number" id="current-port">Đang lấy...</span></div>

    <div id="status-banner" class="status-banner">🟢 Hệ thống Online</div>

    <ul id="score-list">Đang tải điểm...</ul>

    <div class="control-panel">
        <input type="text" id="inputPlayer" value="ThaiLe" placeholder="Mã người chơi">
        <select id="inputAction">
            <option value="KILL_MONSTER">KILL_MONSTER (Cộng điểm)</option>
            <option value="WIN_MATCH">WIN_MATCH (Cộng điểm)</option>
            <option value="LOSE_MATCH">LOSE_MATCH (Trừ điểm)</option>
        </select>
        <input type="number" id="inputPoints" value="100" placeholder="Số điểm">
        <button onclick="sendAction()">🚀 GỬI DỮ LIỆU</button>
    </div>
</div>

<script>
    const port = window.location.port;
    document.getElementById('current-port').innerText = port;

    let isCrashed = false;
    let isRecovering = false;
    let recoveryStartTime = 0;
    let stopwatchInterval = null;

    async function updateScores() {
        try {
            const response = await fetch('/api/scores');
            const scores = await response.json();

            // KHI KẾT NỐI THÀNH CÔNG TRỞ LẠI
            if (isCrashed) {
                isCrashed = false;
                clearInterval(stopwatchInterval);

                const banner = document.getElementById('status-banner');
                banner.className = 'status-banner status-recovered';

                // NẾU NGƯỜI DÙNG CÓ BẤM NÚT ĐO GIỜ
                if (isRecovering) {
                    const recoveryTime = ((Date.now() - recoveryStartTime) / 1000).toFixed(2);
                    banner.innerHTML = `✅ Phục hồi hoàn tất trong: ${recoveryTime} giây!`;
                    isRecovering = false;
                } else {
                    banner.innerHTML = `✅ Hệ thống đã kết nối lại!`;
                }

                setTimeout(() => {
                    if (!isCrashed) {
                        banner.className = 'status-banner';
                        banner.innerHTML = '🟢 Hệ thống Online';
                    }
                }, 5000);
            }

            // IN ĐIỂM RA GIAO DIỆN
            let html = "";
            for (const [player, score] of Object.entries(scores)) {
                html += `<li>${player}: ${score} pts</li>`;
            }

            document.getElementById('score-list').innerHTML =
                html || "<li style='color: white;'>Chưa có dữ liệu</li>";

            document.getElementById('score-list').style.color = "#2ecc71";

        } catch (e) {
            // KHI BỊ MẤT KẾT NỐI
            if (!isCrashed) {
                isCrashed = true;
                isRecovering = false;

                const banner = document.getElementById('status-banner');
                banner.className = 'status-banner status-crashed';

                banner.innerHTML = `
                    ⚠️ MÁY CHỦ SẬP!
                    <button onclick="startRecoveryTimer()"
                        style="margin-left: 10px; padding: 4px 8px; background: #f1c40f; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 4px;">
                        ⏳ Bấm vào đây khi bật lại máy
                    </button>
                `;
            }

            document.getElementById('score-list').innerHTML = "<li>OFFLINE</li>";
            document.getElementById('score-list').style.color = "#e74c3c";
        }
    }

    function startRecoveryTimer() {
        if (!isRecovering && isCrashed) {
            isRecovering = true;
            recoveryStartTime = Date.now();

            const banner = document.getElementById('status-banner');

            stopwatchInterval = setInterval(() => {
                const elapsed = ((Date.now() - recoveryStartTime) / 1000).toFixed(1);
                banner.innerHTML = `🔄 Đang khởi động và nạp Kafka... ${elapsed}s`;
            }, 100);
        }
    }

    async function sendAction() {
        const playerId = document.getElementById('inputPlayer').value || "Unknown";
        const actionType = document.getElementById('inputAction').value;
        const points = parseInt(document.getElementById('inputPoints').value) || 0;

        const payload = {
            playerID: playerId,
            actionType: actionType,
            points: points
        };

        try {
            const response = await fetch('/api/scores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                // Chờ Kafka Consumer xử lý message một chút
                await new Promise(resolve => setTimeout(resolve, 500));

                // Cập nhật điểm mới lên giao diện
                await updateScores();

                // Hiện thông báo thành công ngay trên banner, không dùng alert
                const banner = document.getElementById('status-banner');
                banner.className = 'status-banner status-recovered';
                banner.innerHTML = "✅ Gửi dữ liệu thành công!";

                // Sau 3 giây trả banner về trạng thái Online
                setTimeout(() => {
                    if (!isCrashed) {
                        banner.className = 'status-banner';
                        banner.innerHTML = '🟢 Hệ thống Online';
                    }
                }, 3000);

            } else {
                const banner = document.getElementById('status-banner');
                banner.className = 'status-banner status-crashed';
                banner.innerHTML = "⚠️ Gửi dữ liệu thất bại! Server trả lỗi.";

                setTimeout(() => {
                    if (!isCrashed) {
                        banner.className = 'status-banner';
                        banner.innerHTML = '🟢 Hệ thống Online';
                    }
                }, 3000);
            }

        } catch (error) {
            const banner = document.getElementById('status-banner');
            banner.className = 'status-banner status-crashed';
            banner.innerHTML = "⚠️ Không thể gửi dữ liệu! Máy chủ đã sập.";

            document.getElementById('score-list').innerHTML = "<li>OFFLINE</li>";
            document.getElementById('score-list').style.color = "#e74c3c";
        }
    }

    setInterval(updateScores, 2000);
    updateScores();
</script>
</body>
</html>
